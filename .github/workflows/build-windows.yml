name: Build NovaCut Studio (Windows x64)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild CapCutVS.sln /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCut-Studio-Windows-x64
          path: |
            bin/Release/*.exe
            CapCutVS_AI/ai_worker.py
            setup_plugins.bat
            README.md
            LICENSE
